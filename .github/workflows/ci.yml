name: CI

on:
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Real Postgres (service container) so the suite covers the Postgres
    # code paths — db.tx() client binding, dialect SQL conversion, FK errors —
    # alongside SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          server/package-lock.json
          client/package-lock.json

    - name: Install Dependencies
      run: npm run install:all

    - name: Test suite (SQLite, fresh throwaway DB)
      run: npm test

    - name: Test suite (Postgres service container)
      run: npm test
      env:
        DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard_test

    - name: Build Frontend
      run: npm --prefix client run build
